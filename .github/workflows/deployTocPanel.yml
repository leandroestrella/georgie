name: Publish Website to CPanel
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Without VITE_API_URL the client falls back to mock mode (see
      # web/src/api/client.ts) and would ship a fake-data app to production
      # rather than failing — so check before spending a build on it.
      - name: Check backend config is present
        env:
          # Passed as env rather than interpolated into the script: `${{ }}` is
          # spliced in as text, so a value containing a quote would break (or
          # escape) the shell command.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$VITE_API_URL" || { echo "::error::VITE_API_URL secret is empty — the build would ship in mock mode."; exit 1; }
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "::error::VITE_GOOGLE_CLIENT_ID secret is empty — sign-in would be disabled."; exit 1; }

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build SPA
        run: npm run build
        working-directory: web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # `strict` verifies the server cert against the hostname. If FTP_SERVER
          # is an IP (or the shared cert's SAN list doesn't include it), strict
          # fails with ERR_TLS_CERT_ALTNAME_INVALID. `loose` still encrypts the
          # whole session (defeats passive sniffing) but skips identity
          # verification, so it does not defend against an active MITM. To
          # upgrade: find the hostname the cert is actually issued for —
          #   openssl s_client -connect <FTP_SERVER>:21 -starttls ftp 2>/dev/null \
          #     | openssl x509 -noout -text | grep -A1 "Subject Alternative Name"
          # — set FTP_SERVER to a name in that list, then flip to strict. Do not
          # trust a FileZilla "trust this certificate?" prompt as proof strict
          # will work — that's loose behaviour, it only proves FTPS is offered.
          security: loose
          local-dir: ./web/dist/
          # Adjust to the georgie subdomain docroot relative to the FTP account root.
          server-dir: ./
